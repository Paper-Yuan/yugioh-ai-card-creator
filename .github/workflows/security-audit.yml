name: Security Audit

on:
  # 定期扫描：每周一早上 9 点（UTC）
  schedule:
    - cron: '0 9 * * 1'
  
  # 手动触发
  workflow_dispatch:
  
  # PR 时检查
  pull_request:
    branches: [main]
  
  # 推送到主分支时检查
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'

jobs:
  security-audit:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run security audit
        run: node scripts/security-audit.js
        continue-on-error: true

      - name: 📊 Generate dependency graph
        run: |
          npm list --all --json > dependency-graph.json
          echo "依赖包总数: $(npm list --all --parseable | wc -l)"

      - name: 📄 Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-report
          path: |
            security-reports/latest.md
            dependency-graph.json
          retention-days: 90

      - name: 💬 Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'security-reports/latest.md';
            
            if (fs.existsSync(reportPath)) {
              const report = fs.readFileSync(reportPath, 'utf-8');
              const summary = report.split('## 📊 漏洞统计')[1]?.split('##')[0] || '报告生成失败';
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🔒 安全审计报告\n\n${summary}\n\n📄 完整报告请查看 Artifacts`
              });
            }

      - name: 🚨 Fail on critical vulnerabilities
        run: |
          if [ -f security-reports/latest.md ]; then
            CRITICAL=$(grep -c "🔴 Critical" security-reports/latest.md || echo "0")
            if [ "$CRITICAL" -gt 0 ]; then
              echo "❌ 发现 $CRITICAL 个 Critical 级别漏洞"
              exit 1
            fi
          fi

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, BSD-3-Clause, ISC
